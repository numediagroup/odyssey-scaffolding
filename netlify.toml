# Netlify configuration — static site, no build step needed.
[build]
  publish = "."
  command = ""

# Cache static assets (images, fonts localised under /assets) for a week.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Basic security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
